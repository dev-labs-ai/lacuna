# Development profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Accepts Lacuna's test certificates (e.g. "Pierre de Fermat", password 1234).
lacuna.pki-express.trust-lacuna-test-root=true
# Certificates are only validated by PKI Express on completion, as it always does.
lacuna.signature.validate-certificate-on-selection=false
spring.thymeleaf.cache=false
# PostgreSQL and MinIO from compose.yaml (docker compose up -d postgres minio); development credentials only.
spring.datasource.url=jdbc:postgresql://localhost:5432/lacuna
spring.datasource.username=lacuna
spring.datasource.password=lacuna
lacuna.storage.s3.endpoint=http://localhost:9000
lacuna.storage.s3.access-key=lacuna
lacuna.storage.s3.secret-key=lacuna-secret
