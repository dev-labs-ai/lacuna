# Development profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Accepts Lacuna's test certificates (e.g. "Pierre de Fermat", password 1234).
lacuna.pki-express.trust-lacuna-test-root=true
# Certificates are only validated by PKI Express on completion, as it always does.
lacuna.signature.validate-certificate-on-selection=false
spring.thymeleaf.cache=false
