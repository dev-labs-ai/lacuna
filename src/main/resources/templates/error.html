<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>Erro · Assinador Digital</title>
</head>
<body>
<!-- Rendered by GlobalExceptionHandler, and by Spring Boot for any other error (which provides no title). -->
<main class="container stack">
    <div class="card stack">
        <p class="eyebrow" th:text="|Erro ${status}|">Erro</p>
        <h1 th:text="${title} ?: 'Algo deu errado'">Algo deu errado</h1>
        <pre class="message" th:if="${title != null and message != null}" th:text="${message}">mensagem</pre>
        <details th:if="${details}">
            <summary>Relatório técnico</summary>
            <pre th:text="${details}">relatório</pre>
        </details>
        <div class="actions" th:with="back=${backUrl} ?: '/'">
            <a class="button primary" th:href="@{${back}}"
               th:text="${backLabel} ?: 'Voltar ao início'">Voltar ao início</a>
        </div>
    </div>
</main>
</body>
</html>
