spring.application.name=lacuna

spring.servlet.multipart.max-file-size=20MB
# The batch signature takes several files in a single request.
spring.servlet.multipart.max-request-size=100MB
# The session only carries flash messages; keep its id out of URLs.
server.servlet.session.tracking-modes=cookie

# PKI Express (https://docs.lacunasoftware.com/articles/pki-express/setup)
# Folder containing the pkie executable. Leave unset to use 'pkie' from the PATH (Linux).
#lacuna.pki-express.home=/usr/share/pkie
# Accept certificates from Lacuna's test PKI. NEVER enable in production (see application-dev.properties).
lacuna.pki-express.trust-lacuna-test-root=false
# Additional trusted root certificates (.cer), comma separated.
#lacuna.pki-express.trusted-roots=/etc/lacuna/my-root.cer
lacuna.pki-express.offline=false
# PadesBasic, PadesBasicWithLTV, PkiBrazilPadesAdrBasica, ...
lacuna.pki-express.pades-policy=PadesBasicWithLTV
# CadesBes, CadesBesWithRevocationValues, PkiBrazilCadesAdrBasica, ...
lacuna.pki-express.cades-policy=PkiBrazilCadesAdrBasica
lacuna.pki-express.culture=pt-BR

# Validate the chosen certificate before asking the user to sign (disabled in the dev profile).
lacuna.signature.validate-certificate-on-selection=true

# Web PKI license (binary Base64 or JSON). Not needed on localhost.
#lacuna.web-pki.license=

# Documents: objects in S3 (or an S3-compatible server such as MinIO), described in PostgreSQL.
# Migrations are named V<yyyyMMddHHmmss in UTC>__<description>.sql, so migrations written in parallel branches get
# versions older than ones already applied; out-of-order applies them instead of refusing to start.
spring.flyway.out-of-order=true
#spring.datasource.url=jdbc:postgresql://localhost:5432/lacuna
#spring.datasource.username=
#spring.datasource.password=
# Bucket of the documents, created on startup if missing.
lacuna.storage.bucket=documents
# URL of an S3-compatible server; leave unset for AWS S3.
#lacuna.storage.s3.endpoint=http://localhost:9000
lacuna.storage.s3.region=us-east-1
# Leave unset to take AWS credentials from the environment, profile or role.
#lacuna.storage.s3.access-key=
#lacuna.storage.s3.secret-key=
# PKI Express working files and copies of documents while it works on them. Defaults to <java.io.tmpdir>/lacuna.
#lacuna.storage.dir=/var/lib/lacuna
